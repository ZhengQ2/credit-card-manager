name: Tests

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  owner-service:
    name: Owner service
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: owner-service
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '26'
      - name: Install dependencies
        run: npm ci
      - name: Type-check and test
        run: npm run typecheck && npm test

  ios:
    name: iOS
    runs-on: xcode-27
    timeout-minutes: 30
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.2.app/Contents/Developer
    defaults:
      run:
        working-directory: CardLedger
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
      - name: Run iOS tests
        run: >-
          xcodebuild test
          -project CardLedger.xcodeproj
          -scheme CardLedger
          -destination 'platform=iOS Simulator,name=iPhone 17,OS=27.2'
          -onlyUsePackageVersionsFromResolvedFile
